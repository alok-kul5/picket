# Public telemetry the replay harness downloads. Nothing here is committed to git:
# `python -m picket fetch` pulls each file into .cache/ and normalises it.
# Only log files are fetched. No malware samples are downloaded or executed.

sources:
  otrf:
    name: OTRF Security-Datasets (Mordor)
    url: https://github.com/OTRF/Security-Datasets
    licence: MIT
    base: https://raw.githubusercontent.com/OTRF/Security-Datasets/master/datasets/atomic/
  evtx:
    name: EVTX-ATTACK-SAMPLES
    url: https://github.com/sbousseaden/EVTX-ATTACK-SAMPLES
    licence: GPL-3.0 (used unmodified as test input, not redistributed)
    base: https://raw.githubusercontent.com/sbousseaden/EVTX-ATTACK-SAMPLES/master/
  nextron:
    name: Nextron evtx-baseline (clean Windows installs)
    url: https://github.com/NextronSystems/evtx-baseline
    licence: Apache-2.0
    base: https://github.com/NextronSystems/evtx-baseline/releases/download/v0.8.5/

