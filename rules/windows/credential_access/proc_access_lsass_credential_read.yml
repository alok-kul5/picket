title: Suspicious LSASS Process Access With Credential-Read Rights
id: 33819da0-75d7-52fc-9bf9-f3448e1d115a
status: test
description: Detects a process opening LSASS with the access masks used by credential dumpers such as Mimikatz sekurlsa (PROCESS_VM_READ with query rights) or full access, from a process that is not a known Windows or security component.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: alok-kul5
date: 2026-11-25
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1418'
      - '0x1f0fff'
      - '0x1f1fff'
      - '0x1f2fff'
      - '0x1f3fff'
      - '0x1fffff'
  filter_os:
    SourceImage|endswith:
      - '\svchost.exe'
      - '\wininit.exe'
      - '\csrss.exe'
      - '\services.exe'
      - '\lsm.exe'
      - '\wmiprvse.exe'
      - '\MsMpEng.exe'
      - '\MsSense.exe'
      - '\taskmgr.exe'
      - '\procexp64.exe'
      - '\VsTskMgr.exe'
      - '\Sysmon.exe'
      - '\Sysmon64.exe'
      - '\MRT.exe'
  filter_msiexec:
    SourceImage|endswith: '\MsiExec.exe'
    GrantedAccess:
      - '0x1fffff'
      - '0x1410'
  filter_program_files:
    SourceImage|startswith:
      - 'C:\Program Files\'
      - 'C:\Program Files (x86)\'
      - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'
  condition: selection and not 1 of filter_*
falsepositives:
  - EDR, backup and monitoring agents installed outside Program Files.
  - Administrators using Task Manager or Process Explorer to create a dump on purpose.
  - Windows Installer custom actions (MsiExec) open LSASS during installs. They are filtered, which leaves a blind spot if an attacker proxies through msiexec.
level: high
