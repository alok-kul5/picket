title: Mshta Executing Inline Script or Remote HTA
id: 85c83990-bb44-5754-b80d-3b69ff92b70e
status: test
description: Detects mshta.exe running inline VBScript or JavaScript, loading an HTA from the web or a temp folder, or spawning a shell. Mshta is a signed proxy for running attacker script outside of application control.
references:
  - https://attack.mitre.org/techniques/T1218/005/
  - https://lolbas-project.github.io/lolbas/Binaries/Mshta/
author: alok-kul5
date: 2026-11-25
tags:
  - attack.stealth
  - attack.t1218.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\mshta.exe'
    - OriginalFileName: 'MSHTA.EXE'
  selection_cli:
    CommandLine|contains:
      - 'vbscript:'
      - 'javascript:'
      - 'about:'
      - 'http://'
      - 'https://'
      - '\AppData\'
      - '\Temp\'
      - '\Temporary Internet Files\'
      - '\INetCache\'
      - '\Users\Public\'
  selection_child_parent:
    ParentImage|endswith: '\mshta.exe'
  selection_child_img:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\calc.exe'
  condition: (selection_img and selection_cli) or (selection_child_parent and selection_child_img)
falsepositives:
  - Legacy line-of-business HTA applications. Allow-list them by path and hash.
level: high
