title: WDigest Cleartext Credential Caching Enabled
id: b51b7a59-81f6-55de-875f-cf63d5fd028d
status: test
description: Detects UseLogonCredential being set to 1 under the WDigest provider. LSASS then keeps cleartext passwords in memory again, so a later credential dump returns plaintext.
references:
  - https://attack.mitre.org/techniques/T1112/
  - https://attack.mitre.org/techniques/T1003/001/
author: alok-kul5
date: 2026-11-25
tags:
  - attack.defense-impairment
  - attack.t1112
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\SecurityProviders\WDigest\UseLogonCredential'
    Details:
      - 'DWORD (0x00000001)'
      - 1
  condition: selection
falsepositives:
  - Legacy applications that still need WDigest. Rare after Windows 8.1 and Server 2012 R2.
level: high
