title: Service Binary Path Changed to a Script Host or Staged Payload
id: 10ceda2f-fe11-54ac-a424-17b4646f79eb
status: test
description: Detects sc.exe config changing a service binPath to a shell, script interpreter, LOLBin or a binary in a user-writable folder. Hijacking an existing service gives SYSTEM-level persistence without creating a new service.
references:
  - https://attack.mitre.org/techniques/T1543/003/
  - https://attack.mitre.org/techniques/T1574/011/
author: alok-kul5
date: 2026-11-25
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\sc.exe'
    - OriginalFileName: 'sc.exe'
  selection_verb:
    CommandLine|contains|all:
      - 'config'
      - 'binpath'
  selection_payload:
    CommandLine|contains:
      - 'powershell'
      - 'pwsh'
      - 'cmd /c'
      - 'cmd.exe'
      - 'mshta'
      - 'rundll32'
      - 'regsvr32'
      - 'wscript'
      - 'cscript'
      - ' -enc'
      - '\AppData\'
      - '\Users\Public\'
      - '\Temp\'
  condition: all of selection_*
falsepositives:
  - Software that wraps a script as a service during install. Check the parent process and signer.
level: high
