title: Scheduled Task Created to Run a Script Host or Staged Payload
id: 48f34617-1e89-5fc0-ae5c-d816cfad5c6c
status: test
description: Detects schtasks.exe /create where the task action runs a script interpreter, a LOLBin, an encoded command or a binary from a user-writable folder.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: alok-kul5
date: 2026-11-25
tags:
  - attack.execution
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\schtasks.exe'
    - OriginalFileName: 'schtasks.exe'
  selection_create:
    CommandLine|contains: '/create'
  selection_payload:
    CommandLine|contains:
      - 'powershell'
      - 'pwsh'
      - 'cmd /c'
      - 'cmd.exe /c'
      - 'mshta'
      - 'rundll32'
      - 'regsvr32'
      - 'wscript'
      - 'cscript'
      - 'bitsadmin'
      - 'certutil'
      - ' -enc'
      - 'http://'
      - 'https://'
      - '\AppData\'
      - '\Users\Public\'
      - '\Temp\'
  condition: all of selection_*
falsepositives:
  - IT maintenance scripts scheduled from a management tool. These usually run as SYSTEM from a known script share.
level: medium
