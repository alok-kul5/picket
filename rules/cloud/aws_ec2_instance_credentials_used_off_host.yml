title: EC2 Instance Role Credentials Used From a Workstation Client
id: 84b02cae-9793-50da-a4ab-dd26f4f56a6a
status: test
description: Detects API calls made with an EC2 instance role session (the session name is the instance id) where the user agent shows a desktop operating system such as macOS. Instance credentials stolen through SSRF or the metadata service and replayed from an attacker laptop look exactly like this.
references:
  - https://attack.mitre.org/techniques/T1552/005/
  - https://attack.mitre.org/techniques/T1078/004/
author: alok-kul5
date: 2026-11-25
tags:
  - attack.credential-access
  - attack.t1552.005
  - attack.initial-access
  - attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_session:
    userIdentity.type: 'AssumedRole'
    userIdentity.arn|re: ':assumed-role/[^/]+/i-[0-9a-f]{8,17}$'
  selection_client:
    userAgent|contains:
      - 'Darwin/'
      - 'Windows_NT'
      - 'Windows/10'
      - 'Windows/11'
      - 'Kali'
  condition: all of selection_*
falsepositives:
  - EC2 Mac or Windows instances calling AWS with their own role. Pair with a source IP check against your VPC ranges.
level: high
